# Supabase CLI project config — used by `supabase start` / `supabase db reset`
project_id = "ssmp-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false            # accounts are provisioned by the HOD, never self-signup
enable_manual_linking = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150

[storage]
enabled = true
file_size_limit = "10MiB"

[realtime]
enabled = true
