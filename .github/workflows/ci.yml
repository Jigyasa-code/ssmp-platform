name: CI — SSMP Portal

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: security audit + Jest tests ──────────────────────────────────
  backend:
    name: Backend Tests & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run npm audit (fail on high/critical)
        working-directory: backend
        # Only fail on HIGH or CRITICAL, not moderate
        run: npm audit --audit-level=high

      - name: Run authorization regression tests
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          NODE_ENV: test
        run: npm test

  # ── Frontend: dependency install + lint ──────────────────────────────────
  frontend:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint (if configured)
        working-directory: frontend
        # Don't fail CI if lint script doesn't exist (e.g. before oxlint setup)
        run: npm run lint --if-present

      - name: Build production bundle (type-check)
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build
